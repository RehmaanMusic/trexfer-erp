services:
  - type: web
    name: trexfer-erp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Trexfer ERP"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: trexfer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: trexfer-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: trexfer-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: trexfer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trexfer-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: trexfer-db
    plan: free
    databaseName: trexfer
    user: trexfer
